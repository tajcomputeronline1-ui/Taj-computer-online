
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAJ COMPUTER ONLINE | Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --orange:#f47721;
  --green:#08783b;
  --dark:#17212b;
  --light:#f4f6f8;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--light);
  color:var(--dark);
}
button,input {
  font:inherit;
}
button {
  border:0;
  border-radius:7px;
  padding:11px 16px;
  cursor:pointer;
}
.primary {
  background:var(--green);
  color:white;
}
.login-wrap {
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}
.login-box {
  background:white;
  width:100%;
  max-width:390px;
  padding:28px;
  border-radius:14px;
  box-shadow:0 5px 25px #0001;
}
.login-box h2 {
  color:var(--green);
  text-align:center;
}
input {
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:7px;
  margin:8px 0 15px;
}
#app { display:none; }
header {
  background:white;
  border-bottom:4px solid var(--orange);
  padding:15px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
header h2 {
  margin:0;
  color:var(--green);
  font-size:20px;
}
.layout {
  display:flex;
  min-height:calc(100vh - 70px);
}
nav {
  width:225px;
  background:var(--dark);
  padding:15px 10px;
}
nav button {
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  color:white;
  margin-bottom:5px;
}
nav button:hover,nav button.active {
  background:var(--green);
}
main {
  flex:1;
  padding:22px;
  min-width:0;
}
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
}
.card {
  background:white;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 9px #0001;
}
.card h3 {
  font-size:14px;
  color:#667;
  margin:0 0 12px;
}
.count {
  font-size:28px;
  font-weight:bold;
  color:var(--green);
}
.panel {
  background:white;
  border-radius:10px;
  padding:20px;
  margin-top:20px;
}
#message {
  margin:12px 0;
  color:#b42318;
  white-space:pre-wrap;
}
@media(max-width:700px) {
  .layout { display:block; }
  nav {
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,1fr);
  }
  nav button { font-size:13px; }
  main { padding:14px; }
  header h2 { font-size:16px; }
}
</style>
</head>
<body>

<section class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h2>TAJ COMPUTER ONLINE</h2>
    <p style="text-align:center">ADMIN LOGIN</p>
    <label>Email Address</label>
    <input id="email" type="email" placeholder="Admin email">
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button class="primary" style="width:100%" onclick="login()">Login</button>
    <div id="message"></div>
  </div>
</section>

<div id="app">
  <header>
    <h2>TAJ COMPUTER ONLINE — ADMIN</h2>
    <button class="primary" onclick="logout()">Logout</button>
  </header>

  <div class="layout">
    <nav id="menu">
      <button class="active" onclick="showPage('Dashboard',this)">Dashboard</button>
      <button onclick="showPage('Services Management',this)">Services Management</button>
      <button onclick="showPage('Student Management',this)">Student Management</button>
      <button onclick="showPage('Fee Management',this)">Fee Management</button>
      <button onclick="showPage('Certificate Management',this)">Certificate Management</button>
      <button onclick="showPage('Billing',this)">Billing</button>
      <button onclick="showPage('Gallery Management',this)">Gallery Management</button>
      <button onclick="showPage('Settings',this)">Settings</button>
    </nav>

    <main>
      <h2 id="pageTitle">Dashboard</h2>
      <div id="pageContent"></div>
    </main>
  </div>
</div>

<script>
const SUPABASE_URL = "https://sssyiqorrruvzlhalwwc.supabase.co";
const SUPABASE_KEY = "sb_publishable_qk5Oovdegpxx3StHqONLxA_U4xZdIGq";
const ADMIN_UID = "cc41ca16-fb01-49df-a15a-03e43bee44a1";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "Signing in...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    return;
  }

  if (data.user.id !== ADMIN_UID) {
    await db.auth.signOut();
    message.textContent = "Access denied: Admin account only.";
    return;
  }

  openAdmin();
}

async function checkSession() {
  const { data } = await db.auth.getSession();
  const user = data.session?.user;

  if (user && user.id === ADMIN_UID) {
    openAdmin();
  }
}

function openAdmin() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadDashboard();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

function showPage(title, button) {
  document.getElementById("pageTitle").textContent = title;

  document.querySelectorAll("#menu button").forEach(b => {
    b.classList.remove("active");
  });

  if (button) button.classList.add("active");

  if (title === "Dashboard") {
    loadDashboard();
  } else {
    document.getElementById("pageContent").innerHTML =
      `<div class="panel">
        <h3>${title}</h3>
        <p>This module will be connected to the existing database in the next implementation step.</p>
      </div>`;
  }
}

async function getCount(table) {
  const { count, error } = await db
    .from(table)
    .select("*", { count:"exact", head:true });

  if (error) return "—";
  return count ?? 0;
}

async function loadDashboard() {
  const content = document.getElementById("pageContent");
  content.innerHTML = "<p>Loading dashboard...</p>";

  const tables = [
    ["Services","services"],
    ["Students","students"],
    ["Fee Entries","fee_payments"],
    ["Certificates","certificates"],
    ["Invoices","invoices"]
  ];

  const counts = await Promise.all(
    tables.map(async ([label,table]) => [
      label,
      await getCount(table)
    ])
  );

  content.innerHTML =
    `<div class="cards">
      ${counts.map(([label,count]) => `
        <div class="card">
          <h3>${label}</h3>
          <div class="count">${count}</div>
        </div>
      `).join("")}
    </div>
    <div class="panel">
      <h3>Welcome to Admin Panel</h3>
      <p>TAJ COMPUTER ONLINE, KHATEGAON</p>
    </div>`;
}

checkSession();
</script>
</body>
</html>
