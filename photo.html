<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery | TAJ COMPUTER ONLINE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    color:#222;
}

header{
    background:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    border-bottom:4px solid #138808;
}

.logo h1{color:#e87513;font-size:25px}
.logo p{color:#138808;font-weight:bold;letter-spacing:3px;margin-top:4px}

.contact{text-align:right;line-height:1.8;font-size:14px}
.contact a{color:#138808;text-decoration:none;font-weight:bold}

nav{
    background:#138808;
    padding:14px;
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
}

nav a{color:white;text-decoration:none;font-weight:bold}
nav a:hover{color:#ff9933}

.ticker{background:#ff9933;color:white;padding:10px;font-weight:bold}

.title{text-align:center;padding:35px 12px 20px}
.title h2{color:#e87513;font-size:28px;margin-bottom:10px}
.title p{color:#555;line-height:1.7}

.gallery{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.photo-card{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 13px #00000012;
    transition:.25s;
}

.photo-card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 18px #00000020;
}

.tricolor{height:8px;display:flex}
.orange{background:#ff9933;width:33.33%}
.white{background:white;width:33.33%}
.green{background:#138808;width:33.33%}

.photo-area{
    height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fafafa;
    padding:12px;
}

.photo-area img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.placeholder{
    color:#999;
    text-align:center;
    font-size:15px;
}

.photo-info{
    padding:15px;
    text-align:center;
}

.photo-info h3{
    color:#138808;
    font-size:18px;
}

.section-heading{
    color:#e87513;
    font-size:22px;
    margin:30px 0 18px;
    text-align:center;
}

footer{
    background:#138808;
    color:white;
    text-align:center;
    padding:22px;
    line-height:2;
    margin-top:30px;
}

@media(max-width:600px){
    header{justify-content:center;text-align:center}
    .contact{text-align:center;margin-top:10px}
    nav{gap:17px}
    .title h2{font-size:24px}
}
</style>
</head>
