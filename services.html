/* DEPARTMENT FINDER */
function getDepartment(service) {
  const value = [
    service.name,
    service.short_info,
    service.name_en,
    service.short_info_en
  ].join(" ").toLowerCase();

  for (const department of departments) {
    if (department.id === "other") continue;

    if (department.keywords.some(word =>
      value.includes(word.toLowerCase())
    )) {
      return department.id;
    }
  }

  return "other";
}

function text(hi, en) {
  return currentLanguage === "en" ? en : hi;
}

/* SEARCH */
function filterServices(items) {
  const query = document
    .getElementById("serviceSearch")
    .value.toLowerCase().trim();

  if (!query) return items;

  return items.filter(service => {
    const value = [
      service.name,
      service.name_en,
      service.short_info,
      service.short_info_en,
      service.documents,
      service.documents_en,
      service.benefits,
      service.benefits_en
    ].join(" ").toLowerCase();

    return value.includes(query);
  });
}

/* RENDER DEPARTMENT CARDS */
function renderServices() {
  selectedDepartment = null;

    shown++;

    card.className = "service-card";

    imageBox.className = "card-image";

    const imageService = filtered.find(item => item.image_url);

      img.src = imageService.image_url;
      img.alt = text(department.hi, department.en);
      img.loading = "lazy";
      imageBox.appendChild(img);
    }

    const count = document.createElement("span");
    count.className = "card-count";
    count.textContent = filtered.length;
    imageBox.appendChild(count);

    const title = document.createElement("div");
    title.className = "card-title";

    const h3 = document.createElement("h3");
    h3.textContent = text(department.hi, department.en);

    const sub = document.createElement("p");
    sub.textContent = text(
      department.hindiDescription,
      department.description
    );

    title.appendChild(h3);
    title.appendChild(sub);
    imageBox.appendChild(title);

    const body = document.createElement("div");
    body.className = "card-body";

    const description = document.createElement("p");
    description.textContent = text(
      department.hindiDescription,
      department.description
    );

    const bottom = document.createElement("div");
    bottom.className = "card-bottom";

    const total = document.createElement("span");
    total.className = "service-count";
    total.textContent = currentLanguage === "en"
      ? filtered.length + " services available"

    const view = document.createElement("span");
    view.className = "view-link";

    bottom.appendChild(view);

    body.appendChild(bottom);

    card.appendChild(imageBox);
    card.appendChild(body);

    card.addEventListener("click", () => {
      showDepartmentServices(department, filtered);
    });

    grid.appendChild(card);
  });

  document.getElementById("noResults").style.display =

}

/* APPLY LANGUAGE */
function applyLanguage(language) {
  currentLanguage = language;
  document.documentElement.lang = language;

  const t = translations[language] || translations.hi;

  Object.keys(t).forEach(id => {
    const element = document.getElementById(id);
    if (element) element.textContent = t[id];
  });

  document.getElementById("serviceSearch").placeholder =
    t.searchPlaceholder;

  document.querySelectorAll(".nav a").forEach(link => {
    link.textContent = link.getAttribute(
      language === "en" ? "data-en" : "data-hi"
    );
  });

  if (selectedDepartment) {
    renderDepartmentServices();
  } else {
    renderServices();
  }
}

/* LOAD SERVICES FROM SUPABASE */
async function loadServices() {
  const status = document.getElementById("status");

  try {
    if (!window.supabase) {
      throw new Error("Supabase library load नहीं हुई।");
    }

    if (
      !SUPABASE_KEY ||
      SUPABASE_KEY === "PASTE_YOUR_EXISTING_PUBLISHABLE_KEY_HERE"
    ) {
      throw new Error("Supabase Publishable Key नहीं डाली गई है।");
    }

    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const { data, error } = await supabaseClient
      .from("services")
      .select("*")
      .order("display_order", { ascending: true });

    if (error) throw error;

    allServices = data || [];

    status.style.display = "none";
    renderServices();

  } catch (error) {
    console.error("Services loading error:", error);

    status.style.display = "block";
    status.textContent =
      "सेवाएँ लोड नहीं हो सकीं। कृपया कुछ देर बाद पुनः प्रयास करें।";
  }
}
