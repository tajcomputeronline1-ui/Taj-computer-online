<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services | TAJ COMPUTER ONLINE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --orange: #f58220;
      --green: #168447;
      --dark: #202b36;
      --light: #f7f8fa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      color: var(--dark);
      background: white;
      line-height: 1.6;
    }
    a { text-decoration: none; color: inherit; }
    .top-line {
      height: 5px;
      background: linear-gradient(to right, var(--orange) 33.3%, white 33.3% 66.6%, var(--green) 66.6%);
    }
    header {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px 5%;
    }
    .logo {
      width: 55px;
      height: 55px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--orange), var(--green));
      color: white;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
    }
    .brand h1 { font-size: 21px; line-height: 1.3; }
    .brand small { color: var(--green); font-weight: bold; letter-spacing: 2px; }
    nav {
      background: var(--dark);
      color: white;
      padding: 0 5%;
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 52px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      flex-wrap: wrap;
    }
    nav a { display: inline-block; padding: 13px 12px; font-size: 14px; }
    nav a:hover, nav a.active { background: var(--orange); border-radius: 5px; }
    .search-area { display: flex; align-items: center; gap: 7px; padding: 5px 0; }
    #searchBox {
      display: none;
      width: 150px;
      padding: 8px;
      border: none;
      border-radius: 5px;
    }
    .search-btn {
      border: none; color: white; background: var(--green);
      padding: 9px 12px; border-radius: 5px; cursor: pointer; font-size: 17px;
    }
    .page-heading {
      text-align: center;
      padding: 35px 15px;
      background: linear-gradient(135deg, #fff7ed, #ffffff, #effaf2);
    }
    .page-heading h2 { color: var(--orange); font-size: 29px; }
    .page-heading p { color: #59636e; margin-top: 8px; }
    .services-container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 18px 50px;
    }
    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .service-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      background: white;
      box-shadow: 0 4px 14px #0000000a;
      transition: transform .2s;
    }
    .service-card:hover { transform: translateY(-4px); }
    .service-card img {
      width: 100%;
      height: 175px;
      object-fit: cover;
      display: block;
      background: var(--light);
    }
    .service-card h3 {
      padding: 14px;
      color: var(--dark);
      font-size: 18px;
    }
    .status {
      text-align: center;
      color: #68727d;
      padding: 30px 10px;
    }
    footer {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    footer h3 { margin-bottom: 12px; }
    .social-links {
      display: flex; justify-content: center;
      gap: 12px; flex-wrap: wrap; margin: 15px 0;
    }
    .social-links a {
      background: #ffffff18; border: 1px solid #ffffff30;
      padding: 9px 14px; border-radius: 6px; font-size: 14px;
    }
    .social-links a:hover { background: var(--green); }
    footer small { color: #cbd2d9; }
    @media (max-width: 600px) {
      header { padding: 12px 4%; }
      .brand h1 { font-size: 17px; }
      .logo { width: 47px; height: 47px; }
      nav { padding: 5px 3%; flex-wrap: wrap; gap: 0; }
      .nav-links { justify-content: center; gap: 0; }
      nav a { padding: 10px 8px; font-size: 13px; }
      .search-area { width: 100%; justify-content: center; padding: 5px 0 8px; }
      #searchBox { width: 75%; }
      .page-heading h2 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <div class="top-line"></div>

  <header>
    <div class="logo">T</div>
    <div class="brand">
      <h1>TAJ COMPUTER ONLINE</h1>
      <small>KHATEGAON</small>
    </div>
  </header>

  <nav>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="services.html" class="active">Services</a>
      <a href="about.html">About</a>
      <a href="photo.html">Photos</a>
      <a href="contact.html">Contact</a>
    </div>
    <div class="search-area">
      <input type="search" id="searchBox" placeholder="Search...">
      <button class="search-btn" onclick="toggleSearch()" aria-label="Search">⌕</button>
    </div>
  </nav>

  <section class="page-heading">
    <h2>हमारी सेवाएँ</h2>
    <p>TAJ COMPUTER ONLINE, KHATEGAON पर उपलब्ध सेवाएँ</p>
  </section>

  <main class="services-container">
    <div id="servicesGrid" class="services-grid"></div>
    <div id="status" class="status">सेवाएँ लोड हो रही हैं...</div>
  </main>

  <footer>
    <h3>Follow Us on Social Media</h3>
    <div class="social-links">
      <a href="https://wa.me/919669370386" target="_blank">WhatsApp</a>
      <a href="#" aria-label="Instagram">Instagram</a>
      <a href="#" aria-label="Facebook">Facebook</a>
      <a href="#" aria-label="YouTube">YouTube</a>
    </div>
    <small>© 2026 TAJ COMPUTER ONLINE, KHATEGAON. All Rights Reserved.</small>
  </footer>

  <script>
    function toggleSearch() {
      const box = document.getElementById("searchBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
      if (box.style.display === "block") box.focus();
    }

    // अपनी Supabase Project URL और Publishable Key डालें
    const SUPABASE_URL = "अपना_PROJECT_URL_यहाँ_डालें";
    const SUPABASE_KEY = "अपनी_PUBLISHABLE_KEY_यहाँ_डालें";

    async function loadServices() {
      const grid = document.getElementById("servicesGrid");
      const status = document.getElementById("status");

      if (SUPABASE_URL.includes("यहाँ_डालें") ||
          SUPABASE_KEY.includes("यहाँ_डालें")) {
        status.textContent = "सेवाएँ दिखाने के लिए Supabase Project URL और Publishable Key जोड़ें।";
        return;
      }

      try {
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await client
          .from("services")
          .select("id, name, image_url")
          .order("display_order", { ascending: true });

        if (error) throw error;

        grid.innerHTML = "";

        if (!data || data.length === 0) {
          status.textContent = "अभी कोई सेवा उपलब्ध नहीं है।";
          return;
        }

        data.forEach(service => {
          const card = document.createElement("article");
          card.className = "service-card";

          if (service.image_url) {
            const img = document.createElement("img");
            img.src = service.image_url;
            img.alt = service.name || "Service";
            img.loading = "lazy";
            card.appendChild(img);
          }

          const title = document.createElement("h3");
          title.textContent = service.name || "सेवा";
          card.appendChild(title);
          grid.appendChild(card);
        });

        status.textContent = "";
      } catch (error) {
        console.error(error);
        status.textContent = "सेवाएँ लोड नहीं हो पाईं। Supabase सेटिंग जाँचें।";
      }
    }

    loadServices();
  </script>
</body>
</html>
