
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>हमारी सेवाएँ | TAJ COMPUTER ONLINE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    header {
      text-align: center;
      padding: 22px 12px;
      background: linear-gradient(90deg, #ff9933, white, #138808);
      border-bottom: 3px solid #138808;
    }
    header h1 { margin: 0; font-size: 25px; }
    header p { margin: 7px 0 0; }
    nav {
      background: #08783b;
      padding: 12px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    .heading {
      text-align: center;
      margin: 25px 10px;
    }
    .heading h2 { color: #08783b; }
    .services {
      max-width: 1100px;
      margin: auto;
      padding: 10px 16px 35px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .service-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000018;
      border-bottom: 4px solid #138808;
      text-align: center;
    }
    .service-card img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      display: block;
    }
    .service-card h3 {
      margin: 0;
      padding: 15px 10px;
      color: #08783b;
      font-size: 19px;
    }
    #message {
      text-align: center;
      padding: 25px;
      color: #555;
    }
    footer {
      background: #08783b;
      color: white;
      text-align: center;
      padding: 18px 10px;
    }
  </style>
</head>
<body>

<header>
  <h1>TAJ COMPUTER ONLINE</h1>
  <p>KHATEGAON, MADHYA PRADESH</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="services.html">Services</a>
  <a href="photo.html">Photo</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</nav>

<section class="heading">
  <h2>हमारी सेवाएँ</h2>
  <p>TAJ COMPUTER ONLINE, KHATEGAON</p>
</section>

<div id="message">सेवाएँ लोड हो रही हैं...</div>
<main class="services" id="servicesList"></main>

<footer>
  <p>TAJ COMPUTER ONLINE, KHATEGAON</p>
  <p>मोबाइल: 9669370386</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "sb_publishable_rWhJ27oirBsXo-boqcomBw_o3fXupBi";
  const SUPABASE_KEY = "sb_secret_-U3jtDzsFPhn8yCuR27diA_YUYavlf8";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadServices() {
    const message = document.getElementById("message");
    const list = document.getElementById("servicesList");

    const { data, error } = await db
      .from("services")
      .select("id, name, image_url")
      .order("created_at", { ascending: false });

    if (error) {
      message.textContent = "सेवाएँ लोड नहीं हो सकीं। कृपया बाद में प्रयास करें।";
      console.error(error);
      return;
    }

    list.innerHTML = "";

    if (!data || data.length === 0) {
      message.textContent = "जल्द ही यहाँ हमारी सेवाएँ दिखाई देंगी।";
      return;
    }

    message.textContent = "";

    data.forEach(service => {
      const card = document.createElement("article");
      card.className = "service-card";

      if (service.image_url) {
        const img = document.createElement("img");
        img.src = service.image_url;
        img.alt = service.name || "सेवा की फोटो";
        img.loading = "lazy";
        card.appendChild(img);
      }

      const title = document.createElement("h3");
      title.textContent = service.name || "";
      card.appendChild(title);

      list.appendChild(card);
    });
  }

  loadServices();
</script>

</body>
</html>
