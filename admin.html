body{

button,input,textarea,select{font:inherit}

.card{

 border:1px solid var(--border)

.card h3{color:var(--green);margin:5px 0}
.panel{
 background:white;padding:20px;border-radius:12px;
 margin-top:20px;border:1px solid var(--border)
}
.hidden{display:none}
.submenu{padding-left:12px}

table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:11px;border-bottom:1px solid var(--border);text-align:left}

 if(btn)btn.classList.add("active");

 const content=document.getElementById("pageContent");

async function loadCounts(){
 if(!db)return;
 const tables=[
  ["services","serviceCount"],
  ["gallery","galleryCount"],
  ["students","studentCount"],
  ["invoices","invoiceCount"]
 ];
 for(const [table,id] of tables){
  const {count,error}=await db.from(table).select("*",{count:"exact",head:true});

 }

const ADMIN_UID = "cc41ca16-fb01-49df-a15a-03e43bee44a1";

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

async function login() {
  const msg = document.getElementById("loginMsg");
  try {
    const {data, error} = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    if (data.user.id !== ADMIN_UID) {
      await db.auth.signOut();
      throw new Error("आपको Admin Access नहीं है।");
    }

    await openAdmin();
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function checkSession() {
  if (!db) return;

  const {data} = await db.auth.getSession();

  if (data.session?.user?.id === ADMIN_UID) {
    await openAdmin();
  } else if (data.session) {
    await db.auth.signOut();
  }
}

async function openAdmin() {
  document.getElementById("loginPage").style.display = "none";
  document.getElementById("adminLayout").style.display = "block";
  await loadCounts();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

checkSession();

function showPage(name, btn) {
  document.getElementById("pageTitle").textContent = name;

  document.querySelectorAll(".menu button").forEach(b =>
    b.classList.remove("active")
  );

  if (btn) btn.classList.add("active");

  const content = document.getElementById("pageContent");

  if (name === "Dashboard") {
    content.innerHTML = `
      <div class="cards">
        <div class="card">Services<h3 id="serviceCount">0</h3></div>
        <div class="card">Gallery<h3 id="galleryCount">0</h3></div>
        <div class="card">Students<h3 id="studentCount">0</h3></div>
        <div class="card">Invoices<h3 id="invoiceCount">0</h3></div>
      </div>`;
    loadCounts();
    return;
  }
if (name === "Student Details") {
    renderStudents();
    return;
}

 
  if (name === "Services" || name === "Gallery") {
    renderManager(name);
    return;
  }

  content.innerHTML = `
    <div class="panel">
      <h2>${safeText(name)}</h2>
      <p>इस विभाग का अगला मॉड्यूल तैयार किया जाएगा।</p>
    </div>`;
}

async function loadCounts() {
  const tables = [
    ["services", "serviceCount"],
    ["gallery", "galleryCount"],
    ["students", "studentCount"],
    ["invoices", "invoiceCount"]
  ];

  for (const [table, id] of tables) {
    const el = document.getElementById(id);
    if (!el) continue;

    const {count, error} = await db
      .from(table)
      .select("*", {count:"exact", head:true});

    if (!error) el.textContent = count ?? 0;
  }
}

async function renderManager(kind, edit = null) {
  const isService = kind === "Services";
  const table = isService ? "services" : "gallery";
  const fields = isService ? [
    ["name", "सेवा का नाम (हिंदी)", "text"],
    ["name_en", "Service Name (English)", "text"],
    ["documents", "आवश्यक दस्तावेज", "textarea"],
    ["benefits", "सेवा के लाभ / उद्देश्य", "textarea"],
    ["image_url", "Photo URL", "url"],
    ["display_order", "क्रम संख्या", "number"]
  ] : [
    ["title", "Photo Title", "text"],
    ["image_url", "Image URL", "url"],
    ["description", "Description", "textarea"],
    ["display_order", "क्रम संख्या", "number"]
  ];

  const content = document.getElementById("pageContent");

  const inputs = fields.map(([key, label, type]) => `
    <label>${label}</label>
    ${type === "textarea"
      ? `<textarea id="field_${key}">${safeText(edit?.[key])}</textarea>`
      : `<input id="field_${key}" type="${type}"
          value="${safeText(edit?.[key])}"
          ${key === "name" || key === "title" ? "required" : ""}>`
    }
  `).join("");

  content.innerHTML = `
    <div class="panel">
      <h2>${kind} Management</h2>
      <form id="managerForm">
        ${inputs}
        <button class="btn" type="submit">${edit ? "Update" : "Save"}</button>
        <button class="btn" type="button" id="clearForm">Clear</button>
        <p id="formMessage"></p>
      </form>
    </div>

    <div class="panel">
      <h3>Saved ${kind}</h3>
      <input id="searchRecords" placeholder="Search...">
      <div id="recordList">Loading...</div>
    </div>
  `;

  document.getElementById("clearForm").onclick = () =>
    renderManager(kind);

  document.getElementById("managerForm").onsubmit = async e => {
    e.preventDefault();

    const message = document.getElementById("formMessage");
    message.textContent = "Saving...";

    const row = {};

    fields.forEach(([key]) => {
      const value = document.getElementById("field_" + key).value.trim();
      row[key] = key === "display_order" ? (Number(value) || 0) : value;
    });

    try {
      const result = edit
        ? await db.from(table).update(row).eq("id", edit.id)
        : await db.from(table).insert(row);

      if (result.error) throw result.error;

      alert("Record successfully saved.");
      await renderManager(kind);
      await loadCounts();

    } catch (error) {
      message.textContent = "Error: " + error.message;
    }
  };

  let records = [];

  async function loadRecords() {
    const list = document.getElementById("recordList");
    list.textContent = "Loading...";

    const {data, error} = await db
      .from(table)
      .select("*")
      .order("display_order", {ascending:true});

    if (error) {
      list.textContent = "Error: " + error.message;
      return;
    }

    records = data || [];
    drawRecords();
  }

  function drawRecords() {
    const query = document.getElementById("searchRecords").value.toLowerCase();

    const filtered = records.filter(record =>
      JSON.stringify(record).toLowerCase().includes(query)
    );

    document.getElementById("recordList").innerHTML = filtered.length
      ? `<table>
          <tr><th>Name</th><th>Status</th><th>Action</th></tr>
          ${filtered.map(record => `
            <tr>
              <td>${safeText(isService ? record.name : record.title)}</td>
              <td>${record.is_published ? "Published" : "Hidden"}</td>
              <td>
                <button class="btn" data-edit="${record.id}">Edit</button>
                <button class="btn" data-publish="${record.id}">
                  ${record.is_published ? "Hide" : "Publish"}
                </button>
              </td>
            </tr>
          `).join("")}
        </table>`
      : "कोई रिकॉर्ड नहीं मिला।";

    document.querySelectorAll("[data-edit]").forEach(button => {
      button.onclick = () => {
        const record = records.find(r =>
          String(r.id) === button.dataset.edit
        );
        renderManager(kind, record);
      };
    });

    document.querySelectorAll("[data-publish]").forEach(button => {
      button.onclick = async () => {
        const record = records.find(r =>
          String(r.id) === button.dataset.publish
        );

        const {error} = await db
          .from(table)
          .update({is_published: !record.is_published})
          .eq("id", record.id);

        if (error) alert(error.message);
        else loadRecords();
      };
    });
  }

  document.getElementById("searchRecords").oninput = drawRecords;

  await loadRecords();
}


async function renderStudents(edit = null) {
  const content = document.getElementById("pageContent");

  content.innerHTML = `
    <div class="panel">
      <h2>Student Management</h2>

      <form id="studentForm">
        <h3>${edit ? "Edit Student" : "Add New Student"}</h3>

        <div class="form-grid">
          <label>Enrollment Number
            <input name="enrollment_number" value="${safeText(edit?.enrollment_number || "")}">
          </label>

          <label>Student Name *
            <input name="student_name" required value="${safeText(edit?.student_name || "")}">
          </label>

          <label>Father Name
            <input name="father_name" value="${safeText(edit?.father_name || "")}">
          </label>

          <label>Mother Name
            <input name="mother_name" value="${safeText(edit?.mother_name || "")}">
          </label>

          <label>Mobile Number
            <input name="mobile" type="tel" value="${safeText(edit?.mobile || "")}">
          </label>

          <label>Email
            <input name="email" type="email" value="${safeText(edit?.email || "")}">
          </label>

          <label>Course Name
            <input name="course_name" value="${safeText(edit?.course_name || "")}">
          </label>

          <label>Course Duration
            <input name="course_duration" placeholder="Example: 6 Months"
              value="${safeText(edit?.course_duration || "")}">
          </label>

          <label>Admission Date
            <input name="admission_date" type="date"
              value="${safeText(edit?.admission_date || "")}">
          </label>

          <label>Total Fees
            <input name="total_fees" type="number" min="0" step="0.01"
              value="${edit?.total_fees ?? ""}">
          </label>

          <label>Status
            <select name="status">
              <option value="Active" ${edit?.status === "Active" || !edit ? "selected" : ""}>Active</option>
              <option value="Completed" ${edit?.status === "Completed" ? "selected" : ""}>Completed</option>
              <option value="Inactive" ${edit?.status === "Inactive" ? "selected" : ""}>Inactive</option>
            </select>
          </label>

          <label>Address
            <textarea name="address">${safeText(edit?.address || "")}</textarea>
          </label>
        </div>

        <button type="submit">${edit ? "Update Student" : "Save Student"}</button>
        <button type="button" id="cancelStudent">Cancel</button>
      </form>

      <hr>

      <h3>Student List</h3>

      <input id="studentSearch" placeholder="Search by name, mobile or enrollment number">

      <button type="button" id="exportStudents">Export to Excel</button>
      <button type="button" id="printStudents">Print List</button>

      <div id="studentTable">Loading students...</div>
    </div>
  `;

  let students = [];

  async function loadStudents() {
    const { data, error } = await db
      .from("students")
      .select("*")
      .order("id", { ascending: false });

    if (error) {
      document.getElementById("studentTable").textContent = error.message;
      return;
    }

    students = data || [];
    drawStudents();
  }

  function drawStudents() {
    const search = document.getElementById("studentSearch").value.toLowerCase();

    const filtered = students.filter(s =>
      [
        s.student_name,
        s.father_name,
        s.mobile,
        s.enrollment_number,
        s.course_name
      ].some(v => String(v || "").toLowerCase().includes(search))
    );

    document.getElementById("studentTable").innerHTML = `
      <div style="overflow-x:auto">
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
          <thead>
            <tr>
              <th>Enrollment No.</th>
              <th>Student Name</th>
              <th>Mobile</th>
              <th>Course</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(s => `
              <tr>
                <td>${safeText(s.enrollment_number || "-")}</td>
                <td>${safeText(s.student_name)}</td>
                <td>${safeText(s.mobile || "-")}</td>
                <td>${safeText(s.course_name || "-")}</td>
                <td>${safeText(s.status || "-")}</td>
                <td>
                  <button type="button" data-edit="${s.id}">Edit</button>
                  <button type="button" data-delete="${s.id}">Delete</button>
                  <button type="button" data-print="${s.id}">Print</button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        <p>Total Students: ${filtered.length}</p>
      </div>
    `;

    document.querySelectorAll("[data-edit]").forEach(btn => {
      btn.onclick = () => {
        const student = students.find(s => String(s.id) === btn.dataset.edit);
        renderStudents(student);
      };
    });

    document.querySelectorAll("[data-delete]").forEach(btn => {
      btn.onclick = async () => {
        if (!confirm("Are you sure you want to delete this student?")) return;

        const { error } = await db
          .from("students")
          .delete()
          .eq("id", btn.dataset.delete);

        if (error) {
          alert(error.message);
        } else {
          alert("Student deleted successfully.");
          loadStudents();
        }
      };
    });

    document.querySelectorAll("[data-print]").forEach(btn => {
      btn.onclick = () => {
        const s = students.find(x => String(x.id) === btn.dataset.print);
        printStudent(s);
      };
    });
  }

  function printStudent(s) {
    const w = window.open("", "_blank");
    if (!w) {
      alert("Please allow pop-ups to print.");
      return;
    }

    w.document.write(`
      <html>
      <head><title>Student Details</title></head>
      <body style="font-family:Arial;padding:25px">
        <h2>TAJ COMPUTER ONLINE</h2>
        <h3>Student Details</h3>
        <p><b>Enrollment Number:</b> ${safeText(s.enrollment_number || "-")}</p>
        <p><b>Student Name:</b> ${safeText(s.student_name)}</p>
        <p><b>Father Name:</b> ${safeText(s.father_name || "-")}</p>
        <p><b>Mother Name:</b> ${safeText(s.mother_name || "-")}</p>
        <p><b>Mobile:</b> ${safeText(s.mobile || "-")}</p>
        <p><b>Email:</b> ${safeText(s.email || "-")}</p>
        <p><b>Address:</b> ${safeText(s.address || "-")}</p>
        <p><b>Course:</b> ${safeText(s.course_name || "-")}</p>
        <p><b>Duration:</b> ${safeText(s.course_duration || "-")}</p>
        <p><b>Admission Date:</b> ${safeText(s.admission_date || "-")}</p>
        <p><b>Total Fees:</b> ${safeText(s.total_fees ?? "-")}</p>
        <p><b>Status:</b> ${safeText(s.status || "-")}</p>
        <script>window.onload = () => window.print();<\/script>
      </body>
      </html>
    `);
    w.document.close();
  }

  document.getElementById("studentForm").onsubmit = async e => {
    e.preventDefault();

    const f = new FormData(e.target);
    const record = Object.fromEntries(f.entries());

    record.total_fees = record.total_fees === ""
      ? null
      : Number(record.total_fees);

    if (!record.enrollment_number) {
      record.enrollment_number = null;
    }

    const query = edit
      ? db.from("students").update(record).eq("id", edit.id)
      : db.from("students").insert([record]);

    const { error } = await query;

    if (error) {
      alert(error.message);
      return;
    }

    alert(edit ? "Student updated successfully." : "Student added successfully.");
    renderStudents();
  };

  document.getElementById("studentSearch").oninput = drawStudents;

  document.getElementById("cancelStudent").onclick = () => renderStudents();

  document.getElementById("exportStudents").onclick = () => {
    const headers = [
      "Enrollment Number", "Student Name", "Father Name",
      "Mother Name", "Mobile", "Email", "Address",
      "Course", "Duration", "Admission Date", "Total Fees", "Status"
    ];

    const rows = students.map(s => [
      s.enrollment_number, s.student_name, s.father_name,
      s.mother_name, s.mobile, s.email, s.address,
      s.course_name, s.course_duration, s.admission_date,
      s.total_fees, s.status
    ]);

    const csv = [headers, ...rows]
      .map(row => row.map(v =>
        `"${String(v ?? "").replace(/"/g, '""')}"`
      ).join(","))
      .join("\n");

    const blob = new Blob(["\uFEFF" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "Student_List.csv";
    a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById("printStudents").onclick = () => {
    const w = window.open("", "_blank");
    if (!w) {
      alert("Please allow pop-ups to print.");
      return;
    }

    const rows = students.map(s => `
      <tr>
        <td>${safeText(s.enrollment_number || "-")}</td>
        <td>${safeText(s.student_name)}</td>
        <td>${safeText(s.mobile || "-")}</td>
        <td>${safeText(s.course_name || "-")}</td>
        <td>${safeText(s.status || "-")}</td>
      </tr>
    `).join("");

    w.document.write(`
      <html><head><title>Student List</title></head>
      <body style="font-family:Arial">
        <h2>TAJ COMPUTER ONLINE - Student List</h2>
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
          <tr><th>Enrollment No.</th><th>Name</th><th>Mobile</th><th>Course</th><th>Status</th></tr>
          ${rows}
        </table>
        <script>window.onload = () => window.print();<\/script>
      </body></html>
    `);
    w.document.close();
  };

  await loadStudents();
}








 
 
</script>
