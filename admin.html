const ADMIN_UID = "cc41ca16-fb01-49df-a15a-03e43bee44a1";

function safeText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[c]));
}

async function login() {
  const msg = document.getElementById("loginMsg");
  try {
    const {data, error} = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });

    if (error) throw error;

    if (data.user.id !== ADMIN_UID) {
      await db.auth.signOut();
      throw new Error("आपको Admin Access नहीं है।");
    }

    await openAdmin();
  } catch (e) {
    msg.textContent = e.message;
  }
}

    await openAdmin();
  } else if (data.session) {
    await db.auth.signOut();
  }
}

async function loadCounts() {
  const tables = [
    ["services", "serviceCount"],
    ["gallery", "galleryCount"],
    ["students", "studentCount"],
    ["invoices", "invoiceCount"]
  ];

  for (const [table, id] of tables) {
    const el = document.getElementById(id);
    if (!el) continue;

    const {count, error} = await db
      .from(table)
      .select("*", {count:"exact", head:true});

    if (!error) el.textContent = count ?? 0;
  }
}

async function renderManager(kind, edit = null) {
  const isService = kind === "Services";
  const table = isService ? "services" : "gallery";
  const content = document.getElementById("pageContent");

  const fields = isService ? [
    ["name", "Service Name (Hindi)", "text"],
    ["name_en", "Service Name (English)", "text"],
    ["documents", "Required Documents", "textarea"],
    ["benefits", "Benefits / Purpose", "textarea"],
    ["image_url", "Photo URL", "url"],
    ["display_order", "Display Order", "number"]
  ] : [
    ["title", "Poster Title", "text"],
    ["description", "Description", "textarea"],
    ["display_order", "Display Order", "number"]
  ];

  const inputs = fields.map(([key, label, type]) => `
    <label>${label}</label>
    ${type === "textarea"
      ? `<textarea id="field_${key}">${safeText(edit?.[key])}</textarea>`
      : `<input id="field_${key}" type="${type}"
        value="${safeText(edit?.[key])}"
        ${key === "name" || key === "title" ? "required" : ""}>`
    }
  `).join("");

  content.innerHTML = `
    <div class="panel">
      <h2>${kind} Management</h2>
      <form id="managerForm">
        ${inputs}

        ${!isService ? `
          <label>Upload Poster Image</label>
          <input id="posterFile" type="file"
            accept="image/jpeg,image/png,image/webp">
          <p>Recommended Instagram Size: 1080 × 1350 px (4:5)</p>
          <div id="posterPreview">
            ${edit?.image_url ? `
              <img src="${safeText(edit.image_url)}"
              style="max-width:220px;width:100%;height:auto;">
            ` : ""}
          </div>
        ` : ""}

        <button class="btn" type="submit">
          ${edit ? "Update" : "Save"}
        </button>
        <button class="btn" type="button" id="clearForm">
          Clear
        </button>
        <p id="formMessage"></p>
      </form>
    </div>

    <div class="panel">
      <h3>Saved ${kind}</h3>
      <input id="searchRecords" placeholder="Search...">
      <div id="recordList">Loading...</div>
    </div>
  `;

  document.getElementById("clearForm").onclick = () =>
    renderManager(kind);

  if (!isService) {
    document.getElementById("posterFile").onchange = e => {
      const file = e.target.files?.[0];
      const preview = document.getElementById("posterPreview");

      if (!file) return;

      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        e.target.value = "";
        preview.textContent = "Choose JPG, PNG or WEBP.";
        return;
      }

      preview.innerHTML = `
        <img src="${URL.createObjectURL(file)}"
        alt="Poster Preview"
        style="max-width:220px;width:100%;height:auto;">
      `;
    };
  }

  document.getElementById("managerForm").onsubmit = async e => {
    e.preventDefault();

    const msg = document.getElementById("formMessage");
    const btn = e.target.querySelector('button[type="submit"]');

    msg.textContent = "Saving...";
    btn.disabled = true;

    try {
      const row = {};

      fields.forEach(([key]) => {
        const value = document.getElementById("field_" + key).value.trim();
        row[key] = key === "display_order"
          ? (Number(value) || 0)
          : value;
      });

      if (!isService) {
        const file = document.getElementById("posterFile").files?.[0];

        if (file) {
          const ext = file.name.split(".").pop().toLowerCase();
          const path = `gallery/poster-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

          const upload = await db.storage
            .from("service-photos")
            .upload(path, file, {
              upsert: false,
              contentType: file.type
            });

          if (upload.error) throw upload.error;

          row.image_url = db.storage
            .from("service-photos")
            .getPublicUrl(path).data.publicUrl;

        } else if (edit?.image_url) {

  document.getElementById("feeForm").onsubmit = async e => {
    e.preventDefault();

    const msg = document.getElementById("feeMessage");
    const btn = document.getElementById("feeSaveBtn");

    if (!selectedStudent) {
      msg.textContent = "पहले विद्यार्थी चुनें।";
      return;
    }

    const amount = Number(document.getElementById("feeAmount").value);
    const total = Number(selectedStudent.total_fees || 0);
    const paid = payments.reduce(
      (sum, p) => sum + Number(p.amount || 0), 0
    );
    const balance = total - paid;

    if (!Number.isFinite(amount) || amount <= 0) {
      msg.textContent = "सही जमा राशि लिखें।";
      return;
    }

    if (amount > balance) {
      msg.textContent = "जमा राशि बाकी फीस से अधिक नहीं हो सकती।";
      return;
    }

    const paymentDate = document.getElementById("feeDate").value;

    if (!paymentDate) {
      msg.textContent = "Payment Date चुनें।";
      return;
    }

    const receiptNumber =
      "TCO-" +
      paymentDate.replaceAll("-", "") +
      "-" +
      Date.now().toString().slice(-6);

    const utr = document.getElementById("feeUTR").value.trim();
    const remarks = document.getElementById("feeRemarks").value.trim();

    const finalRemarks = [
      utr ? "UTR: " + utr : "",
      remarks
    ].filter(Boolean).join(" | ");

    btn.disabled = true;
    msg.textContent = "Payment Save हो रही है...";

    try {
      const { data: saved, error } = await db
        .from("fee_payments")
        .insert([{
          student_id: selectedStudent.id,
          enrollment_number: selectedStudent.enrollment_number,
          receipt_number: receiptNumber,
          payment_date: paymentDate,
          amount: amount,
          payment_mode: document.getElementById("feeMode").value,
          remarks: finalRemarks
        }])
        .select()
        .single();

      if (error) throw error;

      alert("फीस सफलतापूर्वक जमा हो गई।");

      await loadFeeDetails();

      document.getElementById("feeAmount").value = "";
      document.getElementById("feeUTR").value = "";
      document.getElementById("feeRemarks").value = "";

      printFeeReceipt(saved);

      msg.textContent = "Payment Saved. Receipt तैयार है।";

    } catch (err) {
      msg.textContent = "Error: " + err.message;
    } finally {
      btn.disabled = false;
    }
  };

  studentSelect.onchange = loadFeeDetails;

  // Receipt size selector
  const historyPanel = document.getElementById("feeHistory");
  const sizeLabel = document.createElement("div");

  sizeLabel.innerHTML = `
    <label>Receipt Paper Size</label>
    <select id="receiptSize">
      <option value="A4">A4 Portrait</option>
      <option value="A5">A5 Portrait</option>
    </select>
  `;

  historyPanel.parentElement.insertBefore(sizeLabel, historyPanel);
}

async function loadReport(type) {
    const area = document.getElementById("reportArea");
    area.innerHTML = "<p>रिपोर्ट लोड हो रही है...</p>";

    try {
        let title = "";
        let headers = [];
        let rows = [];
        let details = [];

        if (type === "students") {
            title = "Student Details Report";

            const { data, error } = await db
                .from("students")
                .select("*")
                .order("student_name");

            if (error) throw error;

            details = data || [];

            headers = [
                "Enrollment No.", "Student Name", "Father Name",
                "Mobile", "Course", "Admission Date", "View"
            ];

            rows = details.map(s => [
                s.enrollment_number, s.student_name, s.father_name,
                s.mobile, s.course_name, s.admission_date
            ]);
        }

        else if (type === "fees") {
            title = "Fees Management Report";

            const [sr, fr] = await Promise.all([
                db.from("students").select("*").order("student_name"),
                db.from("fee_payments").select("*").order("payment_date")
            ]);

            if (sr.error) throw sr.error;
            if (fr.error) throw fr.error;

            const payments = fr.data || [];
            details = (sr.data || []).map(s => {
                const history = payments.filter(p =>
                    (p.student_id != null &&
                     String(p.student_id) === String(s.id)) ||
                    (p.enrollment_number &&
                     p.enrollment_number === s.enrollment_number)
                );

                const paid = history.reduce(
                    (sum, p) => sum + Number(p.amount || 0), 0
                );

                return {
                    student: s,
                    history,
                    paid,
                    total: Number(s.total_fees || 0),
                    balance: Number(s.total_fees || 0) - paid
                };
            });

            headers = [
                "Enrollment No.", "Student Name", "Course",
                "Total Fees", "Paid Fees", "Balance Fees", "View"
            ];

            rows = details.map(d => [
                d.student.enrollment_number,
                d.student.student_name,
                d.student.course_name,
                d.total,
                d.paid,
                d.balance
            ]);
        }

        else if (type === "certificates") {
            title = "Certificate Management Report";

            const [cr, sr] = await Promise.all([
                db.from("certificates").select("*").order("issue_date"),
                db.from("students").select("*")
            ]);

            if (cr.error) throw cr.error;
            if (sr.error) throw sr.error;

            const students = sr.data || [];

            details = (cr.data || []).map(c => ({
                certificate: c,
                student: students.find(
                    s => String(s.id) === String(c.student_id)
                ) || {}
            }));

            headers = [
                "Certificate No.", "Enrollment No.",
                "Student Name", "Course", "Issue Date", "View"
            ];

            rows = details.map(d => [
                d.certificate.certificate_number,
                d.student.enrollment_number,
                d.student.student_name,
                d.student.course_name,
                d.certificate.issue_date
            ]);
        }

        window.reportDetails = details;
        window.reportType = type;

        const esc = v => {
            const el = document.createElement("div");
            el.textContent = v == null ? "" : String(v);
            return el.innerHTML;
        };

        area.innerHTML = `
            <h3>${esc(title)}</h3>
            <p>कुल रिकॉर्ड: ${rows.length}</p>

            <div style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;">
                <button class="btn" onclick="printReport()">Print Report</button>
                <button class="btn" onclick="downloadReportExcel()">Download Excel</button>
            </div>

            <div style="overflow-x:auto;">
            <table id="reportTable" border="1" cellspacing="0"
                cellpadding="7"
                style="width:100%;border-collapse:collapse;margin-top:15px;">
                <thead>
                    <tr>
                        ${headers.map(h => `<th>${esc(h)}</th>`).join("")}
                    </tr>
                </thead>
                <tbody>
                    ${rows.length ? rows.map((row, i) => `
                        <tr>
                            ${row.map(v => `<td>${esc(v)}</td>`).join("")}
                            <td>
                                <button class="btn"
                                  onclick="viewReportRecord(${i})">
                                  View
                                </button>
                            </td>
                        </tr>
                    `).join("") : `
                        <tr><td colspan="${headers.length}">
                            कोई रिकॉर्ड उपलब्ध नहीं है।
                        </td></tr>
                    `}
                </tbody>
            </table>
            </div>
        `;

    } catch (error) {
        area.innerHTML = `
            <p style="color:red;">रिपोर्ट लोड नहीं हुई: ${error.message}</p>
        `;
    }
}

                    canvas.addEventListener("pointerdown", e => {
                        drawing = true;
                        canvas.setPointerCapture(e.pointerId);
                        const r = canvas.getBoundingClientRect();
                        ctx.beginPath();
                        ctx.moveTo(
                            (e.clientX - r.left) * canvas.width / r.width,
                            (e.clientY - r.top) * canvas.height / r.height
                        );
                    });

                    canvas.addEventListener("pointermove", e => {
                        if (!drawing) return;
                        const r = canvas.getBoundingClientRect();
                        ctx.lineTo(
                            (e.clientX - r.left) * canvas.width / r.width,
                            (e.clientY - r.top) * canvas.height / r.height
                        );
                        ctx.stroke();
                    });

                    canvas.addEventListener("pointerup", () => drawing = false);
                    canvas.addEventListener("pointercancel", () => drawing = false);
                }

                    );

function printReport() {
    const table = document.getElementById("reportTable");

    if (!table) {
        alert("पहले रिपोर्ट खोलें।");
        return;
    }

    const title = document.querySelector("#reportArea h3")?.innerText ||
        "Student Report";

    const printWindow = window.open("", "_blank");

    if (!printWindow) {
        alert("Popup अनुमति दें और फिर Print करें।");
        return;
    }

    printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>${title}</title>
            <style>
                body { font-family: Arial, sans-serif; padding: 20px; }

            ${table.outerHTML}
        </body>
        </html>
    `);

    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
}

function downloadReportExcel() {
    const table = document.getElementById("reportTable");

    if (!table) {
        alert("पहले रिपोर्ट खोलें।");
        return;
    }

    const title = document.querySelector("#reportArea h3")?.innerText ||
        "Student Report";

    const excelContent = `
        <html>
        <head>
            <meta charset="UTF-8">
        </head>
        <body>
            <h2>${title}</h2>
            ${table.outerHTML}
        </body>
        </html>
    `;

    const blob = new Blob(
        ["\ufeff", excelContent],
        { type: "application/vnd.ms-excel;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = title.replace(/[^a-z0-9]/gi, "_") + ".xls";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

<script>
const TCO_LOGO_KEY = "tco_brand_logo_v1";

function getTcoLogo() {
  return localStorage.getItem(TCO_LOGO_KEY) || "";
}

function saveTcoLogo() {
  const file = document.getElementById("logoFile").files[0];

  if (!file) {
    alert("कृपया Logo Image चुनें");
    return;
  }

  if (!file.type.startsWith("image/")) {
    alert("केवल Image File चुनें");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    localStorage.setItem(TCO_LOGO_KEY, e.target.result);
    showTcoLogo();
    alert("Logo सफलतापूर्वक सेव हो गया");
  };

  reader.readAsDataURL(file);
}

function removeTcoLogo() {
  if (confirm("क्या आप Logo हटाना चाहते हैं?")) {
    localStorage.removeItem(TCO_LOGO_KEY);
    showTcoLogo();
  }
}

function showTcoLogo() {
  const preview = document.getElementById("logoPreview");
  const logo = getTcoLogo();

  if (preview) {
    preview.src = logo;
    preview.style.display = logo ? "inline-block" : "none";
  }
}

document.addEventListener("DOMContentLoaded", showTcoLogo);
</script>
