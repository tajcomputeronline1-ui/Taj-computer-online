<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAJ COMPUTER ONLINE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#f58220;--green:#168447;--dark:#202b36}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Devanagari",sans-serif;color:var(--dark);line-height:1.6}
.top-line{height:5px;background:linear-gradient(to right,var(--orange) 33.3%,white 33.3% 66.6%,var(--green) 66.6%)}
header{display:flex;align-items:center;gap:13px;padding:15px 5%}
.logo{width:55px;height:55px;border-radius:12px;background:linear-gradient(135deg,var(--orange),var(--green));color:white;display:grid;place-items:center;font-size:25px;font-weight:bold}
.brand h1{font-size:21px}
nav{background:var(--dark);color:white;padding:0 5%;display:flex;align-items:center;min-height:52px}
.nav-links{display:flex;align-items:center;gap:4px;flex:1;flex-wrap:wrap}
nav a{display:inline-block;padding:13px 12px;font-size:14px;text-decoration:none;color:white}
nav a:hover,nav a.active{background:var(--orange);border-radius:5px}
.search-area{display:flex;align-items:center;gap:7px}
#searchBox{display:none;width:150px;padding:8px;border:0;border-radius:5px}
.search-btn{border:0;color:white;background:var(--green);padding:9px 12px;border-radius:5px;cursor:pointer}
.page-heading{text-align:center;padding:35px 15px;background:linear-gradient(135deg,#fff7ed,#fff,#effaf2)}
.page-heading h2{color:var(--orange);font-size:29px}
.detail-container{max-width:900px;margin:auto;padding:30px 18px 50px}
.detail-section{margin-bottom:24px;padding:22px;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 4px 14px #0000000a}
.detail-section h3{font-size:20px;margin-bottom:12px}
.detail-list{padding-left:24px}
.detail-list li{margin:7px 0}
.service-image{width:100%;max-height:280px;object-fit:contain;border-radius:10px;margin-bottom:18px}
.status{text-align:center;color:#68727d;padding:30px 10px}
footer{background:var(--dark);color:white;text-align:center;padding:30px 15px}
footer h3{margin-bottom:12px}
.social-links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}
.social-links a{background:#ffffff18;border:1px solid #ffffff30;padding:9px 14px;border-radius:6px;font-size:14px;color:white;text-decoration:none}
footer small{color:#cbd2d9}
@media(max-width:600px){
header{padding:12px 4%}.brand h1{font-size:17px}.logo{width:47px;height:47px}
nav{padding:5px 3%;flex-wrap:wrap}.nav-links{justify-content:center}
nav a{padding:10px 8px;font-size:13px}
.search-area{width:100%;justify-content:center;padding:5px}
.page-heading h2{font-size:25px}
.detail-section{padding:17px}
}
</style>
</head>
<body>
<div class="top-line"></div>
<header>
<div class="logo">T</div>
<div class="brand"><h1>TAJ COMPUTER ONLINE</h1></div>
</header>
<nav>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="services.html" class="active">Services</a>
<a href="about.html">About</a>
<a href="photo.html">Photos</a>
<a href="contact.html">Contact</a>
</div>
<div class="search-area">
<input type="search" id="searchBox" placeholder="Search...">
<button class="search-btn" onclick="toggleSearch()">⌕</button>
</div>
</nav>
<section class="page-heading"><h2 id="serviceTitle">सेवा की जानकारी</h2></section>
<main class="detail-container">
<div id="serviceContent" class="status">जानकारी लोड हो रही है...</div>
</main>
<footer>
<h3>Follow Us on Social Media</h3>
<div class="social-links">
<a href="https://wa.me/919669370386" target="_blank">WhatsApp</a>
<a href="#">Instagram</a><a href="#">Facebook</a><a href="#">YouTube</a>
</div>
<small>© 2026 TAJ COMPUTER ONLINE. All Rights Reserved.</small>
</footer>
<script>
function toggleSearch(){
const box=document.getElementById("searchBox");
box.style.display=box.style.display==="block"?"none":"block";
if(box.style.display==="block")box.focus();
}
const SUPABASE_URL="https://sssyiqorrruvzlhalwwc.supabase.co";
const SUPABASE_KEY="sb_publishable_qk5Oovdegpxx3StHqONLxA_U4xZdIGq";
function addListSection(parent,heading,value){
if(!value)return;
const section=document.createElement("section");
section.className="detail-section";
const h=document.createElement("h3");
h.textContent=heading;
section.appendChild(h);
const ul=document.createElement("ul");
ul.className="detail-list";
String(value).split(/\n|,|;|•/).map(x=>x.trim()).filter(Boolean).forEach(item=>{
const li=document.createElement("li");
li.textContent=item.replace(/^[-–*•]+\s*/,"");
ul.appendChild(li);
});
section.appendChild(ul);
parent.appendChild(section);
}
async function loadService(){
const target=document.getElementById("serviceContent");
const id=new URLSearchParams(location.search).get("id");
if(!id){target.textContent="सेवा नहीं मिली। Services पेज से दोबारा खोलें।";return;}
try{
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const {data,error}=await client.from("services").select("id,name,documents,benefits,image_url").eq("id",id).single();
if(error)throw error;
document.title=(data.name||"Service")+" | TAJ COMPUTER ONLINE";
document.getElementById("serviceTitle").textContent=data.name||"सेवा";
target.innerHTML="";
if(data.image_url){
const img=document.createElement("img");
img.className="service-image";img.src=data.image_url;img.alt=data.name||"Service";
target.appendChild(img);
}
addListSection(target,"इस सेवा में उपलब्ध कार्य",data.benefits);
addListSection(target,"जरूरी दस्तावेज़",data.documents);
if(!data.benefits&&!data.documents){
const p=document.createElement("p");p.className="status";
p.textContent="इस सेवा की अतिरिक्त जानकारी अभी उपलब्ध नहीं है।";
target.appendChild(p);
}
}catch(error){
console.error(error);
target.textContent="सेवा की जानकारी लोड नहीं हो पाई।";
}
}
loadService();
</script>
</body>
</html>
